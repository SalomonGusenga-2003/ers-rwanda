<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Emergency Reporting System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#e8eef3;
}
.card{
  width:380px;
  background:#eef3f7;
  border-radius:35px;
  padding:25px 30px 35px;
  box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff;
  text-align:center;
}
.system-name{margin-bottom:12px}
.system-name h1{
  font-size:21px;font-weight:900;color:#1a3a5f;
  line-height:1.2;letter-spacing:0.5px
}
.system-name h1 span{color:#e63946}
.system-name p{
  font-size:10px;color:#6b8aa8;font-weight:800;
  letter-spacing:2.5px;margin-top:5px
}
.avatar{
  width:185px;height:185px;
  margin:0 auto 12px;
  border-radius:50%;
  background:#eef3f7;
  box-shadow: 12px 12px 25px #d1d9e6, -12px -12px 25px #ffffff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:8px;
}
.avatar img{
  width:100%;height:100%;
  object-fit:contain;
  border-radius:50%;
}
.welcome-text{
  color:#1a3a5f;
  font-size:26px;
  font-weight:800;
  margin-bottom:18px;
}
.input-box{
  background:#eef3f7;
  border-radius:15px;
  padding:14px 18px;
  margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
  box-shadow: inset 6px 6px 10px #d1d9e6, inset -6px -6px 10px #ffffff;
  position:relative;
}
.input-box i{color:#8a9bb0}
.input-box input{
  border:none;outline:none;background:transparent;
  width:100%;font-size:15px;color:#2c3e50;
}
.options{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;margin:10px 5px 22px;
}
.options label{display:flex;align-items:center;gap:6px;color:#2c3e50;cursor:pointer}
.options input{accent-color:#2c3e50}
.options a{color:#3b82f6;text-decoration:none;font-weight:600}
.btn-sign{
  width:100%;padding:14px;
  border:none;border-radius:15px;
  background:#eef3f7;
  box-shadow: 8px 8px 15px #d1d9e6, -8px -8px 15px #ffffff;
  font-size:18px;font-weight:700;color:#2c3e50;
  cursor:pointer;transition:0.2s;
}
.btn-sign:active{box-shadow: inset 6px 6px 10px #d1d9e6, inset -6px -6px 10px #ffffff}
.divider{
  display:flex;align-items:center;gap:15px;
  margin:25px 0;color:#8a9bb0;font-size:13px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#cbd5e1}
.socials{display:flex;justify-content:center;gap:20px}
.social{
  width:55px;height:55px;border-radius:50%;
  background:#eef3f7;
  box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;text-decoration:none;
  transition:0.2s;
}
.social:active{box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff}
.fa-google{color:#ea4335}
.flash{background:#ffdddd;color:#a00;padding:10px;border-radius:10px;margin-bottom:15px;font-size:14px}
.flash.success{background:#ddffdd;color:#060}
.signup-link{margin-top:20px;font-size:13px;color:#8a9bb0}
.signup-link a{color:#3b82f6;font-weight:700;text-decoration:none}
#toggleEye{cursor:pointer; position:absolute; right:18px; color:#8a9bb0; transition:0.2s}
#toggleEye:hover{color:#1a3a5f}
</style>
</head>
<body>
<div class="card">
  <div class="system-name">
    <h1>🚨 <span>EMERGENCY</span><br>REPORTING SYSTEM</h1>
    <p>RWANDA • SECURE & FAST</p>
  </div>

  <div class="avatar">
    <img src="/static/logo.png" alt="ERS Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828640.png'">
  </div>

  <h2 class="welcome-text">Welcome!</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="/login">
    <div class="input-box">
      <i class="fa-solid fa-user"></i>
      <input type="text" name="email" placeholder="Email / Username" value="salomongusenga25@gmail.com" required>
    </div>
    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" name="password" id="passwordField" placeholder="Password" value="admin123" required>
      <i class="fa-solid fa-eye" id="toggleEye" onclick="togglePassword()"></i>
    </div>

    <div class="options">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-sign">Sign In</button>
  </form>

  <div class="divider">or continue with</div>

  <div class="socials">
    <a href="#" class="social"><i class="fa-brands fa-google"></i></a>
  </div>

  <p class="signup-link">Not Registered? <a href="/signup">SIGN UP</a></p>
</div>

<script>
function togglePassword() {
  const pass = document.getElementById('passwordField');
  const eye = document.getElementById('toggleEye');
  if (pass.type === 'password') {
    pass.type = 'text';
    eye.classList.remove('fa-eye');
    eye.classList.add('fa-eye-slash');
    eye.style.color = '#1a3a5f';
  } else {
    pass.type = 'password';
    eye.classList.remove('fa-eye-slash');
    eye.classList.add('fa-eye');
    eye.style.color = '#8a9bb0';
  }
}
</script>

</body>
</html>
