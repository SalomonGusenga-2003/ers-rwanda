<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - ERS Rwanda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e8eef3}
.card{width:380px;background:#eef3f7;border-radius:35px;padding:30px 30px 35px;box-shadow:20px 20px 40px #d1d9e6,-20px -20px 40px #ffffff;text-align:center}
.system-name h1{font-size:20px;font-weight:900;color:#1a3a5f} .system-name h1 span{color:#e63946}
.avatar{width:120px;height:120px;margin:0 auto 15px;border-radius:50%;background:#eef3f7;box-shadow:12px 12px 25px #d1d9e6,-12px -12px 25px #ffffff;display:flex;align-items:center;justify-content:center;font-size:50px;color:#1a3a5f}
.welcome-text{color:#1a3a5f;font-size:20px;font-weight:800;margin-bottom:8px}
.email-show{color:#3b82f6;font-size:12px;margin-bottom:18px;word-break:break-all}
.input-box{background:#eef3f7;border-radius:15px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:inset 6px 6px 10px #d1d9e6,inset -6px -6px 10px #ffffff;position:relative}
.input-box i{color:#8a9bb0} .input-box input{border:none;outline:none;background:transparent;width:100%;font-size:15px;color:#2c3e50}
.btn-sign{width:100%;padding:14px;border:none;border-radius:15px;background:#1a3a5f;box-shadow:8px 8px 15px #d1d9e6,-8px -8px 15px #ffffff;font-size:16px;font-weight:700;color:#fff;cursor:pointer}
.flash{padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px} .flash.success{background:#ddffdd;color:#060} .flash.danger{background:#ffdddd;color:#a00}
#toggleEye1,#toggleEye2{cursor:pointer;position:absolute;right:18px}
</style>
</head>
<body>
<div class="card">
  <div class="system-name"><h1>🚨 <span>ERS</span> RWANDA</h1></div>
  <div class="avatar"><i class="fa-solid fa-lock-open"></i></div>
  <h2 class="welcome-text">Password Nshya</h2>
  <p class="email-show">{{email}}</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, message in messages %}<div class="flash {{cat}}">{{message}}</div>{% endfor %}{% endif %}
  {% endwith %}
  <form method="POST">
    <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" name="password" id="pass1" placeholder="Password nshya (min 8)" required><i class="fa-solid fa-eye" id="toggleEye1" onclick="toggle1()"></i></div>
    <div class="input-box"><i class="fa-solid fa-check"></i><input type="password" name="confirm_password" id="pass2" placeholder="Emeza Password" required><i class="fa-solid fa-eye" id="toggleEye2" onclick="toggle2()"></i></div>
    <button type="submit" class="btn-sign">Hindura Password</button>
  </form>
</div>
<script>
function toggle1(){const p=document.getElementById('pass1'), e=document.getElementById('toggleEye1'); if(p.type==='password'){p.type='text'; e.classList.replace('fa-eye','fa-eye-slash')}else{p.type='password'; e.classList.replace('fa-eye-slash','fa-eye')}}
function toggle2(){const p=document.getElementById('pass2'), e=document.getElementById('toggleEye2'); if(p.type==='password'){p.type='text'; e.classList.replace('fa-eye','fa-eye-slash')}else{p.type='password'; e.classList.replace('fa-eye-slash','fa-eye')}}
</script>
</body>
</html>
